[project]
name = "remoteripple-installer"
version = "1.0.0"
description = "RemoteRipple 一键离线静默安装器 - tkinter version"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remoteripple_installer"]
