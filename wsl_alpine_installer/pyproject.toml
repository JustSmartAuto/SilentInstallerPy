[project]
name = "wsl-alpine-installer"
version = "1.1.0"
description = "WSL2 Alpine Linux 一键离线静默安装器"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsl_alpine_installer"]
