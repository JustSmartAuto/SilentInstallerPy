[project]
name = "ntp-installer"
version = "1.0.0"
description = "Meinberg NTP Server 一键离线安装器 - tkinter version"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ntp_installer"]
