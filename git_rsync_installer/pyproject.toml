[project]
name = "git-rsync-installer"
version = "1.0.0"
description = "Git + rsync 一键离线安装器 - tkinter version"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_rsync_installer"]
