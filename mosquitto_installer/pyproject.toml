[project]
name = "mosquitto-installer"
version = "1.0.0"
description = "Mosquitto MQTT Broker 一键离线安装器 - tkinter version"
requires-python = ">=3.10"
dependencies = ["paho-mqtt>=2.0"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosquitto_installer"]
