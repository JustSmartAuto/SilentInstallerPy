[project]
name = "uv-installer"
version = "0.11.23"
description = "UV Offline Installer - tkinter version"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uv_installer"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "assets/",
    "build.py",
]

[tool.uv]
default-groups = ["dev"]
